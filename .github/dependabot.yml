version: 2
updates:
  # Maintain dependencies for npm (Node frontend dependencies)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # Maintain dependencies for pip (Python backend dependencies)
  - package-ecosystem: "pip"
    directory: "/python-backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
