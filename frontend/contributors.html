<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contributors | Repo Rizz</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bg: '#070809',
            surface: '#0f1115',
            'surface-elevated': '#181b21',
            border: '#272a30',
            lime: '#b6ff42',
            violet: '#8b5cf6',
            coral: '#ff5c5c',
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="/static/contributors.css">
</head>
<body class="min-h-full flex flex-col grid-bg">

  <div class="scanline-overlay"></div>
  <div class="fixed inset-0 bg-[radial-gradient(circle_at_top,rgba(139,92,246,0.04),transparent_40%)] pointer-events-none z-0"></div>

  <!-- Navbar -->
  <nav class="fixed top-0 left-0 right-0 z-50 border-b border-border" style="background: rgba(7, 8, 9, 0.85); backdrop-filter: blur(12px);">
    <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <button id="logo-btn" class="relative w-8 h-8 focus:outline-none focus:ring-2 focus:ring-lime rounded-sm transition-transform hover:scale-105">
          <img src="/static/logo.png" alt="Repo Rizz Logo" class="object-contain w-full h-full">
        </button>
        <a href="/" class="flex items-center">
          <span class="text-lg font-semibold tracking-tight hover:opacity-80 transition-opacity">
            REPO <span class="text-lime">RIZZ</span>
          </span>
        </a>
      </div>

      <div class="hidden md:flex items-center gap-1">
        <a href="/" class="px-4 py-2 rounded-lg text-sm font-medium transition-colors text-gray-400 hover:text-white hover:bg-surface">Home</a>
        <a href="/analyze" class="px-4 py-2 rounded-lg text-sm font-medium transition-colors text-gray-400 hover:text-white hover:bg-surface">Repo's Rizz</a>
        <a href="/compare" class="px-4 py-2 rounded-lg text-sm font-medium transition-colors text-gray-400 hover:text-white hover:bg-surface">Repo Battle</a>
        <a href="/history" class="px-4 py-2 rounded-lg text-sm font-medium transition-colors text-gray-400 hover:text-white hover:bg-surface">History</a>
        <a href="/contributors" class="px-4 py-2 rounded-lg text-sm font-medium transition-all duration-200 text-lime bg-surface-elevated">Contributors</a>
      </div>

      <div class="flex items-center gap-3">
        <a href="https://github.com/krishna19072007/repo-rizz" target="_blank" rel="noopener noreferrer" class="text-gray-400 hover:text-white text-sm transition-colors flex items-center gap-1">
          <i data-lucide="github" class="w-4 h-4"></i> GitHub
        </a>
      </div>
    </div>
  </nav>

  <!-- Main content -->
  <main class="flex-1 w-full max-w-7xl mx-auto px-6 pt-28 pb-24 relative z-10">

    <!-- Header -->
    <header class="space-y-4 mb-14">
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full border border-lime/20 bg-lime/5 text-lime text-xs font-mono tracking-wider uppercase">
        <span class="w-1.5 h-1.5 rounded-full bg-lime animate-pulse"></span>
        Team Directory · v1.0
      </div>
      <h1 class="text-5xl md:text-6xl font-extrabold tracking-tight leading-none text-white">
        CONTRIB<span class="text-lime">UTORS</span>
      </h1>
      <p class="text-gray-400 text-lg max-w-xl leading-relaxed">
        Meet the people building Repo Rizz.
      </p>
    </header>

    <!-- Contributors grid -->
    <section id="contributors-section">
      <div id="contributors-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
      <div id="contributors-empty" class="hidden text-center py-24 border border-dashed border-border rounded-2xl">
        <p class="text-sm font-mono text-gray-500">NO CONTRIBUTORS YET — CHECK BACK SOON.</p>
      </div>
      <div id="contributors-loading" class="text-center py-24">
        <div class="inline-block w-6 h-6 border-2 border-border border-t-lime rounded-full animate-spin"></div>
        <p class="mt-3 text-xs font-mono text-gray-500">LOADING DIRECTORY...</p>
      </div>
    </section>
  </main>

  <!-- Footer & Brand Modal injected by app.js -->

  <script src="https://unpkg.com/@supabase/supabase-js@2.115.0/dist/umd/supabase.js"></script>
  <script src="/static/auth.js"></script>
  <script src="/static/app.js"></script>
  <script>
    // ============================================================
    // Public contributors directory.
    // This page NEVER shows admin controls and never checks the
    // admin session — it stays a public directory even for an
    // authenticated Rizz Master. Management lives at
    // /contributors/admin (authorized server-side).
    // ============================================================
    // SVG placeholder used when no image is available (data URI is CSP-safe)
    const PLACEHOLDER_URI = "data:image/svg+xml;utf8," + encodeURIComponent(
      `<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
        <rect width="400" height="400" fill="#0f1115"/>
        <circle cx="200" cy="160" r="56" fill="none" stroke="#272a30" stroke-width="6"/>
        <path d="M60 330c20-64 80-96 140-96s120 32 140 96" fill="none" stroke="#272a30" stroke-width="6"/>
        <text x="200" y="368" text-anchor="middle" fill="#3a3f46" font-family="monospace" font-size="14" letter-spacing="4">REPO RIZZ</text>
      </svg>`
    );

    // --- helpers -------------------------------------------------
    function esc(value) {
      // Escape everything rendered into innerHTML (defense against stored XSS)
      return String(value == null ? "" : value)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }

    // Avatar priority: custom upload -> GitHub avatar -> safe placeholder
    function avatarSources(c) {
      const sources = [];
      if (c.custom_avatar_url) sources.push(c.custom_avatar_url);
      sources.push(`https://github.com/${encodeURIComponent(c.github_username)}.png`);
      sources.push(PLACEHOLDER_URI);
      return sources;
    }

    // --- data loading ---------------------------------------------
    async function loadContributors() {
      const grid = document.getElementById("contributors-grid");
      const empty = document.getElementById("contributors-empty");
      const loading = document.getElementById("contributors-loading");
      try {
        const res = await fetch("/api/contributors", { credentials: "same-origin" });
        if (!res.ok) throw new Error("failed");
        const data = await res.json();
        const rows = Array.isArray(data.contributors) ? data.contributors : [];
        loading.classList.add("hidden");
        if (rows.length === 0) {
          empty.classList.remove("hidden");
          grid.innerHTML = "";
        } else {
          empty.classList.add("hidden");
          grid.innerHTML = rows.map((c, i) => renderCard(c, i)).join("");
          observeReveals();
        }
      } catch (e) {
        loading.classList.add("hidden");
        grid.innerHTML = `
          <div class="sm:col-span-2 lg:col-span-3 text-center py-24 border border-dashed border-coral/30 rounded-2xl">
            <p class="text-sm font-mono text-coral">COULD NOT LOAD CONTRIBUTORS — IS THE BACKEND RUNNING?</p>
          </div>`;
      }
    }

    function renderCard(c, index) {
      const sources = avatarSources(c);
      return `
      <article class="contributor-card card-reveal rounded-2xl border border-border bg-surface relative overflow-hidden group"
               style="transition-delay: ${Math.min(index * 60, 360)}ms">
        <div class="card-glow"></div>
        <div class="card-avatar-wrap aspect-square border-b border-border">
          <div class="card-avatar-skeleton"></div>
          <img class="card-avatar absolute inset-0 w-full h-full" alt="${esc(c.display_name)}"
               src="${esc(sources[0])}"
               data-sources='${esc(JSON.stringify(sources))}' data-idx="0">
          <div class="card-pixel-grid"></div>
        </div>
        <div class="p-5 space-y-3">
          <div class="flex items-start justify-between gap-2">
            <div class="min-w-0">
              <h3 class="text-base font-bold text-white truncate">${esc(c.display_name)}</h3>
              <p class="text-xs font-mono text-gray-500 truncate">@${esc(c.github_username)}</p>
            </div>
            ${c.role ? `<span class="shrink-0 text-[9px] font-mono font-bold text-lime bg-lime/10 border border-lime/20 px-2 py-1 rounded uppercase tracking-wider">${esc(c.role)}</span>` : ""}
          </div>
          ${c.description ? `<p class="text-xs text-gray-400 leading-relaxed line-clamp-3">${esc(c.description)}</p>` : ""}
          <a href="${esc(c.github_url)}" target="_blank" rel="noopener noreferrer"
             class="inline-flex items-center gap-1.5 text-[10px] font-mono tracking-widest text-gray-400 hover:text-lime transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-3.5 h-3.5"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg>
            VIEW PROFILE
          </a>
        </div>
      </article>`;
    }

    // Image fallback chain + reveal-on-load
    document.addEventListener("load", (e) => {
      const img = e.target;
      if (img.classList && img.classList.contains("card-avatar")) {
        img.classList.add("loaded");
        const skeleton = img.parentElement.querySelector(".card-avatar-skeleton");
        if (skeleton) skeleton.remove();
      }
    }, true);

    document.addEventListener("error", (e) => {
      const img = e.target;
      if (img.classList && img.classList.contains("card-avatar")) {
        let sources = [];
        try { sources = JSON.parse(img.dataset.sources || "[]"); } catch (err) { sources = []; }
        let idx = Number(img.dataset.idx || 0) + 1;
        if (idx >= sources.length) idx = sources.length - 1;
        if (sources[idx]) {
          img.dataset.idx = idx;
          img.src = sources[idx];
        }
      }
    }, true);

    // --- scroll reveal ---------------------------------------------
    function observeReveals() {
      const cards = document.querySelectorAll(".card-reveal");
      if (!("IntersectionObserver" in window)) {
        cards.forEach(el => el.classList.add("revealed"));
        return;
      }
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add("revealed");
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.12 });
      cards.forEach(el => observer.observe(el));
    }

    // --- boot (single path, whether DOM is ready or not) ------------
    function boot() {
      loadContributors();
    }
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", boot);
    } else {
      boot();
    }
  </script>
</body>
</html>
